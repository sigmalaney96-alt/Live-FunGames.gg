<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Live FunGames</title>

        <script src="/uv/uv.bundle.js"></script>
        <script src="/uv/uv.config.js"></script>

        <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/uv/sw.js", {
                    scope: __uv$config.prefix,
                });
            });
        }
        </script>

        <link rel="stylesheet" href="example.css">
    </head>
    <body>
        <iframe id="iframeWindow" class="iframeWindow" title="Proxied website"></iframe>

        <div id="welcomePopup" class="popupBackdrop" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden>
            <div class="popupCard">
                <p id="welcomeTitle">Thank you for using FunGames.gg</p>
                <button id="closePopup" type="button">Close</button>
            </div>
        </div>

        <script src="example.js"></script>
    </body>
</html>
